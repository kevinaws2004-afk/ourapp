name: daylog
description: "Local-first personal activity tracker (internal codename: daylog)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # Bundled OFL fonts (ADR-016). Never fetched at runtime.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Variable.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
    # DM Mono (OFL) for numeric tokens only: tabular digits (ADR-032).
    - family: DMMono
      fonts:
        - asset: assets/fonts/dm_mono/DMMono-Regular.ttf
        - asset: assets/fonts/dm_mono/DMMono-Medium.ttf
          weight: 500
    # Official Phosphor icon fonts (MIT, @phosphor-icons/web 2.1.2; ADR-024).
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
